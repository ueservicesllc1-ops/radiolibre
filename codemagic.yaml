workflows:
  ios-app-store:
    name: Radio Libre iOS App Store & TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.freedomlabs.radiolibre
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync iOS Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing (fetch or generate profiles automatically)
        script: |
          app-store-connect fetch-signing-files "com.freedomlabs.radiolibre" \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles
      - name: Build and package IPA for App Store
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
