workflows:
  ios-app-store:
    name: Radio Libre iOS App Store & TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync iOS Capacitor
        script: |
          npx cap sync ios
      - name: Generate Apple Distribution Certificate and Provisioning Profile
        script: |
          # Create distribution certificate if none exists in Apple Developer
          app-store-connect create-certificate --type IOS_DISTRIBUTION || true
          # Create and download provisioning profile for com.freedomlabs.radiolibre
          app-store-connect fetch-signing-files "com.freedomlabs.radiolibre" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build and package IPA for App Store
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
