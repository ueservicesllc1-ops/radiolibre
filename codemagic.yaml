workflows:
  ios-app-store:
    name: Radio Libre iOS App Store & TestFlight
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple App Store
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync iOS Capacitor
        script: |
          npx cap sync ios
      - name: Generate private key for signing certificate
        script: |
          ssh-keygen -t rsa -b 2048 -m PEM -f $CM_BUILD_DIR/cert_key -q -N ""
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "com.freedomlabs.radiolibre" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:$CM_BUILD_DIR/cert_key
      - name: Set up keychain and code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and package IPA for App Store
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
