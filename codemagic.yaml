workflows:
  ios-workflow:
    name: iOS Sideloadly IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync iOS Capacitor
        script: |
          npx cap sync ios
      - name: Build and Package IPA
        script: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -r build/derived/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../RadioLibre.ipa Payload
    artifacts:
      - RadioLibre.ipa
